<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Write Markdown with LaTeX and live calculations, then view it as an interactive page.">
  <title>active-md playground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%3D%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="bar">
    <h1 class="brand">active-md <span class="tag">playground</span></h1>
    <div class="mode" role="group" aria-label="Mode">
      <button type="button" id="mode-edit" aria-pressed="true">Edit</button>
      <button type="button" id="mode-view" aria-pressed="false">View</button>
    </div>
    <div class="actions">
      <button type="button" id="share" title="Copy a link that contains this document">Share link</button>
      <button type="button" id="sample" title="Replace the text with the example document">Example</button>
    </div>
  </header>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <main>
    <section id="edit-pane" class="pane">
      <label for="source" class="visually-hidden">Document source (Markdown, LaTeX and calc)</label>
      <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="problems">
        <h2 id="problems-title">No problems</h2>
        <ul id="problems" aria-labelledby="problems-title"></ul>
      </div>
    </section>
    <section id="view-pane" class="pane" hidden>
      <article id="doc" class="doc"></article>
    </section>
  </main>
  <footer class="foot">
    Everything stays in your browser. <a href="https://github.com/vchernoy/active-md">Source and docs</a> · <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>E</kbd> switches Edit and View.
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
